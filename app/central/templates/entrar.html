{% extends "_base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao" style="max-width: 400px; margin: 40px auto;">
  <h1>Entrar</h1>
  <p class="sub">Painel da plataforma: cadastro das imobiliárias.</p>
  <form method="post" action="/plataforma/entrar">
    <div style="margin-bottom: 14px;">
      <label for="login">Usuário</label>
      <input type="text" id="login" name="login" value="{{ login or '' }}" autocomplete="username" autofocus required>
    </div>
    <div>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>
    <div class="acoes"><button type="submit" style="width: 100%; justify-content: center;">Entrar</button></div>
  </form>
</div>
{% endblock %}
