{# Ícones de traço (24x24, currentColor) da área do representante. #}

{%- elif nome == "mais" -%}<path d="M12 5v14M5 12h14"/>
{%- elif nome == "play" -%}<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/>
{%- elif nome == "conta" -%}<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>

{%- elif nome == "seta" -%}<path d="m9 18 6-6-6-6"/>

{%- elif nome == "relogio" -%}<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>

{% macro iniciais(nome) -%}
{%- set partes = (nome or "?").split() -%}
{{ (partes[0][0] ~ (partes[-1][0] if partes | length > 1 else "")) | upper }}
{%- endmacro %}
