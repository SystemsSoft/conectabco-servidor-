<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block titulo %}Contratar o sistema{% endblock %} · Associação Conecta do Brasil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #050F22; --navy-900: #07162E; --navy-800: #0C2247; --green-600: #0E9566; --green-500: #14B87C;
      --green-50: #E8F8F1; --ink: #0E1A2F; --text: #3B4A61; --muted: #64748B; --line: #E2E8F0; --bg-alt: #F4F7FB;
      --erro: #B42318; --erro-fundo: #FDECEA; --radius: 18px; --radius-sm: 12px;
      --shadow: 0 10px 30px -10px rgba(14, 26, 47, .18), 0 2px 6px rgba(14, 26, 47, .05);
      --font-head: "Plus Jakarta Sans", system-ui, sans-serif; --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 var(--font-body); color: var(--text); background: var(--bg-alt); }
    a { color: var(--green-600); }
    header { background: var(--navy-900); color: #fff; }
    header .dentro, main { max-width: 920px; margin: 0 auto; padding: 18px 20px; }
    header .dentro { display: flex; align-items: center; gap: 12px; }
    header .marca { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-family: var(--font-head); font-weight: 700; }
    header .marca span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--green-500); color: var(--navy-900); font-weight: 800; }
    header small { display: block; font-family: var(--font-body); font-weight: 400; opacity: .7; font-size: 12px; }
    main { padding-top: 32px; padding-bottom: 64px; }
    h1 { font-family: var(--font-head); color: var(--ink); font-size: clamp(26px, 4vw, 34px); line-height: 1.2; margin: 0 0 8px; }
    h2 { font-family: var(--font-head); color: var(--ink); font-size: 19px; margin: 0 0 14px; }
    h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 10px; }
    .sub { margin: 0 0 24px; }
    .passos { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; padding: 0; list-style: none; font-size: 13px; }
    .passos li { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
    .passos li.atual { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }
    .passos li.feito { background: var(--green-50); border-color: var(--green-50); color: var(--green-600); }
    .cartao { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 18px; }
    .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 16px; }
    label { display: block; font-weight: 600; font-size: 13px; color: var(--ink); margin-bottom: 6px; }
    .ajuda { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    input[type=text], input[type=email], input[type=tel], select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); font: inherit; background: #fff; color: var(--ink); }
    input:focus, select:focus { outline: 2px solid var(--green-500); outline-offset: 1px; border-color: transparent; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--text); font-size: 14px; }
    .check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--green-600); }
    .botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border-radius: 999px; border: 0; font: 600 16px var(--font-body); cursor: pointer; text-decoration: none; background: var(--green-500); color: var(--navy-900); }
    .botao:hover { background: var(--green-600); color: #fff; }
    .botao.claro { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .botao.claro:hover { background: var(--bg-alt); color: var(--ink); }
    .botao[disabled] { opacity: .6; cursor: wait; }
    .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
    .aviso { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 18px; background: var(--erro-fundo); color: var(--erro); }
    .ok { background: var(--green-50); color: var(--green-600); }
    .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 20px; font-size: 14.5px; }
    .resumo span { color: var(--muted); }
    .plano { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; background: var(--navy-900); color: #fff; border-radius: var(--radius); padding: 18px 22px; margin-bottom: 18px; }
    .plano strong { font-family: var(--font-head); font-size: 28px; }
    .plano { align-items: center; }
    .plano .botao.claro { padding: 10px 18px; font-size: 14.5px; }
    input[type=file] { font: inherit; font-size: 14px; max-width: 100%; }
    .opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
    .opcoes .cartao { margin: 0; display: flex; flex-direction: column; }
    .opcoes .cartao .acoes { margin-top: auto; padding-top: 16px; }
    ol.instrucoes { padding-left: 20px; margin: 0; font-size: 14.5px; }
    ol.instrucoes li { margin-bottom: 6px; }
    iframe.contrato { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-alt); }
    @media (max-width: 640px) { iframe.contrato { display: none; } .cartao { padding: 18px; } }
    footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 20px 40px; }
  </style>
</head>
<body>
  <header><div class="dentro"><a class="marca" href="https://xn--associaoconectabci-7sb3f.com.br/"><span>C</span><div>Conecta do Brasil<small>Contratação do sistema imobiliário</small></div></a></div></header>
  <main>
    {% if erro %}<div class="aviso" role="alert">{{ erro }}</div>{% endif %}
    {% block conteudo %}{% endblock %}
  </main>
  <footer>Associação Conecta do Brasil Corretores de Imóveis · Barra do Piraí – RJ · Seus dados são tratados conforme a LGPD.</footer>
  <script>
    document.querySelectorAll('form[data-demora]').forEach(function (f) {
      f.addEventListener('submit', function () {
        var b = f.querySelector('button[type=submit]');
        if (b) { setTimeout(function () { b.disabled = true; b.textContent = b.dataset.enviando || 'Aguarde...'; }, 0); }
      });
    });
  </script>
</body>
</html>
